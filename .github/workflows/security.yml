# Security & dependency scanning for CI (production readiness).
# Runs the test suite, audits Python and npm dependencies for known CVEs, and scans the
# built container images with Trivy. Fails the build on high/critical findings.
name: security

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pip-audit
      - name: Run backend tests
        run: cd backend && python -m pytest tests -q
      - name: Audit Python dependencies (fail on vulnerabilities)
        run: pip-audit -r backend/requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build frontend
        run: cd frontend && npm ci && npm run build
      - name: Audit npm dependencies (fail on high)
        run: cd frontend && npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t network-sla-api:ci backend
          docker build -t network-sla-frontend:ci frontend
      - name: Scan API image (Trivy, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: network-sla-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend image (Trivy, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: network-sla-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
