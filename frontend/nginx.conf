client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;
server { listen 8080; server_tokens off; root /usr/share/nginx/html; index index.html;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
  # Text assets were served uncompressed: measured 465 KB (393 KB JS + 72 KB CSS) per fresh
  # load, vs 128 KB gzipped — a 72% transfer reduction. gzip_vary keeps caches correct, and
  # compression is applied to proxied API JSON responses too (gzip_proxied).
  # (.xlsx/.pptx are deliberately NOT listed: they are already zip-compressed, so gzipping
  # them costs CPU for no transfer saving — and the long OOXML MIME type overflows nginx's
  # default types_hash_bucket_size, which fails the config outright.)
  gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;
  location /api/ { proxy_pass http://api:8000; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 180s; proxy_send_timeout 180s; }
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate" always; add_header Pragma "no-cache" always; add_header Expires "0" always; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
}
